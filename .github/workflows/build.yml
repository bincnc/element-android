name: Build RocketChat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          
          echo "[OK] Android SDK installed"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Fix Gradle JVM options
        run: |
          if [ -f "gradle.properties" ]; then
            sed -i 's/-XX:MaxPermSize=[^ ]*//g' gradle.properties
            echo "[OK] Fixed gradle.properties"
          fi

      - name: Apply RocketChat customizations
        run: |
          echo "=== Applying RocketChat customizations ==="
          
          # 1. Set default homeserver URL to chat.picn.eu.org
          find . -name "strings.xml" | while read f; do
            if grep -q "default_homeserver_url" "$f"; then
              sed -i 's|<string name="default_homeserver_url">.*</string>|<string name="default_homeserver_url">https://chat.picn.eu.org</string>|' "$f"
              echo "[OK] Set homeserver in $f"
            fi
          done

          # 2. Change app name to RocketChat
          find . -name "strings.xml" | while read f; do
            if grep -q 'name="app_name"' "$f"; then
              sed -i 's|<string name="app_name">.*</string>|<string name="app_name">RocketChat</string>|' "$f"
              echo "[OK] Set app_name in $f"
            fi
          done

          # 3. Replace launcher icons
          ICON_DIR="vector-app/src/main/res"
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            SRC="icons/mipmap-${dir}.png"
            DST_DIR="$ICON_DIR/mipmap-${dir}"
            if [ -d "$DST_DIR" ] && [ -f "$SRC" ]; then
              cp "$SRC" "$DST_DIR/ic_launcher.png"
              cp "$SRC" "$DST_DIR/ic_launcher_round.png"
              echo "[OK] Replaced icons in mipmap-${dir}"
            fi
          done

          # 4. Adaptive icon
          ANYDPI="$ICON_DIR/mipmap-anydpi-v26"
          if [ -d "$ANYDPI" ] && [ -f "icons/anydpi-v26.png" ]; then
            cp "icons/anydpi-v26.png" "$ANYDPI/ic_launcher_foreground.png"
            echo "[OK] Replaced adaptive icon foreground"
          fi

          echo "=== Customizations applied ==="

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :vector-app:assembleGplayDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocketChat-debug
          path: vector-app/build/outputs/apk/gplay/debug/*.apk
          retention-days: 30