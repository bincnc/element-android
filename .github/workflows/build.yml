name: Build RocketChat APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Element Android version tag (e.g. v1.6.42)'
        required: true
        default: 'v1.6.42'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Apply customizations
        run: |
          echo "=== Applying RocketChat customizations ==="
          
          # 1. Set default homeserver URL to chat.picn.eu.org
          # Find and replace in strings.xml
          find app/src -name "strings.xml" -exec sed -i \
            's|<string name="default_homeserver_url">.*</string>|<string name="default_homeserver_url">https://chat.picn.eu.org</string>|g' {} \;
          echo "[OK] Default homeserver set to https://chat.picn.eu.org"
          
          # 2. Change app name to RocketChat
          find app/src -name "strings.xml" -exec sed -i \
            's|<string name="app_name">.*</string>|<string name="app_name">RocketChat</string>|g' {} \;
          echo "[OK] App name changed to RocketChat"
          
          # 3. Replace launcher icons with rocket icon
          for dir in app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              basename_dir=$(basename "$dir")
              if [ -f "icons/${basename_dir}.png" ]; then
                cp "icons/${basename_dir}.png" "$dir/ic_launcher.png"
                cp "icons/${basename_dir}.png" "$dir/ic_launcher_round.png"
                echo "[OK] Replaced icons in $basename_dir"
              fi
            fi
          done
          
          # 4. Handle adaptive icon (anydpi-v26)
          if [ -d "app/src/main/res/mipmap-anydpi-v26" ]; then
            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'ADAPTIVE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          ADAPTIVE_EOF
              
              # Copy foreground image
              cp icons/anydpi-v26.png app/src/main/res/mipmap-anydpi-v26/ic_launcher_foreground.png
              echo "[OK] Adaptive icon configured"
          fi
          
          # 5. Create background color for adaptive icon
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/ic_launcher_background.xml << 'BG_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          BG_EOF
          echo "[OK] Icon background color set"
          
          echo "=== All customizations applied ==="

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocketChat-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
